<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CocktailBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- LINKS: PUMPEN -->
  <aside class="sidebar">
    <h2>Pumpen</h2>
    <div id="pumpList"></div>
  </aside>

  <!-- MAIN -->
  <main class="app">

    <header class="header">
      <h1>CocktailBot</h1>
      <button class="emergency-stop" onclick="emergencyStop()">⛔</button>
    </header>

    <!-- STATUS -->
    <section class="status">
      <h2>Status</h2>
      <div class="status-box idle" id="statusBox">
        <div class="progress-ring">
          <svg width="60" height="60">
            <circle cx="30" cy="30" r="26"></circle>
            <circle cx="30" cy="30" r="26" id="progressCircle"></circle>
          </svg>
        </div>
        <div class="status-text">
          <span id="statusText">Bereit</span>
          <small id="timeLeft"></small>
        </div>
      </div>
    </section>

    <!-- REZEPTE -->
    <section class="recipes">
      <div class="recipes-header">
        <h2>Rezepte</h2>
        <button class="btn primary" onclick="openRecipeWizard()">
          ➕ Rezept hinzufügen
        </button>
      </div>

      <div id="recipeList"></div>
    </section>


  </main>

  <!-- RECHTS: ZUTATEN -->
  <aside class="sidebar right">
    <h2>Zutaten</h2>

    <button class="btn primary add-ingredient"
            onclick="openAddIngredient()">
      ➕ Zutat hinzufügen
    </button>

    <div id="ingredientList"></div>
  </aside>

</div>

<!-- ================= ZUTAT MODAL ================= -->
<div class="modal" id="ingredientModal">
  <div class="modal-content">
    <h3>Zutat hinzufügen</h3>

    <input id="ingredientNameInput"
           type="text"
           placeholder="Name der Zutat">

    <button class="btn primary" onclick="addIngredient()">
      Speichern
    </button>

    <button class="btn ghost" onclick="closeAddIngredient()">
      Abbrechen
    </button>
  </div>
</div>
<!-- ================= REZEPT MODAL ================= -->
<div class="modal" id="recipeModal">
  <div class="modal-content large">
    <h3>Rezept erstellen</h3>

    <input id="recipeNameInput"
           type="text"
           placeholder="Rezeptname">

    <div id="recipeIngredients"></div>

    <button class="btn ghost" onclick="addRecipeIngredientRow()">
      ➕ Zutat hinzufügen
    </button>

    <button class="btn primary" onclick="saveRecipe()">
      ✔ Rezept speichern
    </button>

    <button class="btn ghost" onclick="closeRecipeWizard()">
      Abbrechen
    </button>
  </div>
</div>

<!-- ================= START-MENGE MODAL ================= -->
<div class="modal" id="startModal">
  <div class="modal-content">
    <h3>Rezept starten</h3>

    <p id="startRecipeName"></p>

    <input id="startTotalMl"
           type="number"
           min="10"
           step="10"
           placeholder="Menge in ml (z. B. 200)">

    <button class="btn primary" onclick="confirmStartRecipe()">
      ▶ Starten
    </button>

    <button class="btn ghost" onclick="closeStartModal()">
      Abbrechen
    </button>
  </div>
</div>


<!-- ================= KALIBRIER-WIZARD ================= -->
<div class="modal" id="calibrationModal">
  <div class="modal-content">
    <h3>Pumpe kalibrieren</h3>

    <p id="calibText">Glas unter den Auslass stellen und starten.</p>
    <div class="spinner" id="calibSpinner" style="display:none;"></div>

    <button class="btn calibrate" id="calibStartBtn">
      ▶ Start (5 Sekunden)
    </button>

    <input id="calibMlInput" type="number"
           placeholder="Gemessene ml"
           style="display:none;">

    <button class="btn primary" id="calibSaveBtn"
            style="display:none;">
      ✔ Kalibrierung speichern
    </button>

    <button class="btn ghost" onclick="closeCalibration()">
      Abbrechen
    </button>
  </div>
</div>



<script>
/* ===================== STATE ===================== */
const PUMP_COUNT = 4;
const CALIB_SECONDS = 5;

let pendingStartRecipe = null;


let ingredients = [];
let recipes = [];
let pumpCalibration = {};

let machineRunning = false;
let remainingMs = 0;
let maxRemainingMs = 1;

let currentCalibPump = null;

/* ===================== UI HELPERS ===================== */
function updateProgressRing() {
  const r = 26;
  const c = 2 * Math.PI * r;
  const circle = document.getElementById("progressCircle");

  const progress = machineRunning ? remainingMs / maxRemainingMs : 0;
  circle.style.strokeDasharray = c;
  circle.style.strokeDashoffset = c * (1 - progress);
}

/* ===================== INITIAL SNAPSHOT ===================== */
async function loadInitialState() {
  const calib = await (await fetch("/api/pump/calibration")).json();
  pumpCalibration = {};
  calib.pumps.forEach(p => pumpCalibration[p.id] = p);

  ingredients = await (await fetch("/api/ingredients")).json();
  recipes = await (await fetch("/api/recipes")).json();

  renderPumps();
  renderRecipes();
  renderIngredients();
}

/* ===================== PUMPEN ===================== */
function renderPumps() {
  const list = document.getElementById("pumpList");
  list.innerHTML = "";

  for (let id = 0; id < PUMP_COUNT; id++) {
    const ing = ingredients.find(i => i.pumpId === id);
    const calib = pumpCalibration[id];

    const card = document.createElement("div");
    card.className = "pump-card";
    card.innerHTML = `
      <strong>Pumpe ${id}</strong>

      <div class="pump-status">
        <span class="status-dot ${calib?.calibrated ? "ok" : "bad"}"></span>
        <span class="status-text">
          ${calib?.calibrated
            ? `kalibriert (${calib.mlPerSec.toFixed(2)} ml/s)`
            : "nicht kalibriert"}
        </span>
      </div>

      <select ${machineRunning ? "disabled" : ""}>
        <option value="">— keine Zutat —</option>
        ${ingredients.map(i => `
          <option value="${i.name}"
            ${ing && ing.name === i.name ? "selected" : ""}
            ${i.pumpId >= 0 && i.pumpId !== id ? "disabled" : ""}>
            ${i.name}
          </option>
        `).join("")}
      </select>

      <button class="btn calibrate"
              onclick="openCalibration(${id})"
              ${machineRunning ? "disabled" : ""}>
        🧪 Kalibrieren
      </button>
    `;

    card.querySelector("select").onchange =
      e => assignIngredientToPump(id, e.target.value);

    list.appendChild(card);
  }
}

async function assignIngredientToPump(pumpId, name) {
  const current = ingredients.find(i => i.pumpId === pumpId);

  // 1️⃣ aktuelle Zutat von der Pumpe lösen (NICHT löschen!)
  if (current) {
    await fetch(
      `/api/ingredients/assign?name=${encodeURIComponent(current.name)}&pumpId=-1`,
      { method: "POST" }
    );
  }

  // 2️⃣ neue Zutat zuweisen (falls gewählt)
  if (name) {
    await fetch(
      `/api/ingredients/assign?name=${encodeURIComponent(name)}&pumpId=${pumpId}`,
      { method: "POST" }
    );
  }

  await loadInitialState();
}



/* ===================== REZEPTE ===================== */
function renderRecipes() {
  const list = document.getElementById("recipeList");
  list.innerHTML = "";

  recipes.forEach(r => {
    const blocked = r.ingredients.some(ri => {
      const ing = ingredients.find(i => i.name === ri.name);
      const calib = ing ? pumpCalibration[ing.pumpId] : null;
      return !ing || !calib || !calib.calibrated;
    });

    const card = document.createElement("div");
    card.className = "recipe-card";

    card.innerHTML = `
      <div class="recipe-main">
        <div>
          <strong>${r.name}</strong>
          <div class="recipe-sub">
            ${r.ingredients.map(i => `${i.name} ${i.percent}%`).join(" · ")}
          </div>
        </div>

        <div class="recipe-actions">
          <button class="btn start"
                  ${machineRunning || blocked ? "disabled" : ""}>
            Start
          </button>

          <button class="btn delete"
                  title="Rezept löschen">
            🗑️
          </button>
        </div>
      </div>
    `;

    // Start
    card.querySelector(".btn.start").onclick =
  () => openStartModal(r.name);


    // Delete
    card.querySelector(".btn.delete").onclick =
      () => deleteRecipe(r.name);

    list.appendChild(card);
  });
}

function openStartModal(recipeName) {
  pendingStartRecipe = recipeName;

  document.getElementById("startRecipeName").textContent =
    `Rezept: ${recipeName}`;

  document.getElementById("startTotalMl").value = 200;
  document.getElementById("startModal").style.display = "flex";
}

function closeStartModal() {
  pendingStartRecipe = null;
  document.getElementById("startModal").style.display = "none";
}

async function confirmStartRecipe() {
  const ml = parseInt(
    document.getElementById("startTotalMl").value
  );

  if (!pendingStartRecipe) return;

  if (!ml || ml <= 0) {
    alert("Bitte gültige Menge eingeben");
    return;
  }

  await fetch(
    `/api/recipe/start?name=${encodeURIComponent(pendingStartRecipe)}&totalMl=${ml}`,
    { method: "POST" }
  );

  closeStartModal();
}


async function deleteRecipe(name) {
  if (!confirm(`Rezept "${name}" wirklich löschen?`)) return;

  const res = await fetch(
    `/api/recipes?name=${encodeURIComponent(name)}`,
    { method: "DELETE" }
  );

  if (!res.ok) {
    alert("Rezept konnte nicht gelöscht werden");
    return;
  }

  await loadInitialState();
}


/* ===================== ZUTATEN ===================== */
function renderIngredients() {
  const list = document.getElementById("ingredientList");
  list.innerHTML = "";

  ingredients.forEach(i => {
    const row = document.createElement("div");
    row.className = "ingredient-row";
    row.innerHTML = `
      <span>${i.name}</span>
      <button class="btn delete"
              onclick="deleteIngredient('${i.name}')">🗑️</button>
    `;
    list.appendChild(row);
  });
}

function openAddIngredient() {
  document.getElementById("ingredientNameInput").value = "";
  document.getElementById("ingredientModal").style.display = "flex";
}

function closeAddIngredient() {
  document.getElementById("ingredientModal").style.display = "none";
}

async function addIngredient() {
  const name = document.getElementById("ingredientNameInput").value.trim();
  if (!name) return alert("Name fehlt");

  const res = await fetch(`/api/ingredients?name=${encodeURIComponent(name)}`, { method: "POST" });
  if (!res.ok) return alert("Zutat existiert");

  closeAddIngredient();
  await loadInitialState();
}

async function deleteIngredient(name) {
  if (!confirm(`Zutat "${name}" löschen?`)) return;
  await fetch(`/api/ingredients?name=${encodeURIComponent(name)}`, { method: "DELETE" });
  await loadInitialState();
}

/* ===================== KALIBRIERUNG ===================== */
function openCalibration(id) {
  currentCalibPump = id;
  document.getElementById("calibText").textContent =
    "Glas unter den Auslass stellen und starten.";
  document.getElementById("calibSpinner").style.display = "none";
  document.getElementById("calibMlInput").style.display = "none";
  document.getElementById("calibSaveBtn").style.display = "none";
  document.getElementById("calibStartBtn").style.display = "block";
  document.getElementById("calibrationModal").style.display = "flex";
}

function closeCalibration() {
  document.getElementById("calibrationModal").style.display = "none";
}

document.getElementById("calibStartBtn").onclick = async () => {
  let remaining = CALIB_SECONDS;
  const btn = document.getElementById("calibStartBtn");

  btn.disabled = true;
  btn.textContent = `▶ Läuft… ${remaining} s`;
  document.getElementById("calibSpinner").style.display = "block";

  await fetch(`/api/pump/start?id=${currentCalibPump}&duration=${CALIB_SECONDS * 1000}`, { method: "POST" });

  const timer = setInterval(() => {
    remaining--;
    if (remaining > 0)
      btn.textContent = `▶ Läuft… ${remaining} s`;
  }, 1000);

  setTimeout(() => {
    clearInterval(timer);
    btn.style.display = "none";
    document.getElementById("calibSpinner").style.display = "none";
    document.getElementById("calibMlInput").style.display = "block";
    document.getElementById("calibSaveBtn").style.display = "block";
  }, CALIB_SECONDS * 1000);
};

document.getElementById("calibSaveBtn").onclick = async () => {
  const ml = parseFloat(document.getElementById("calibMlInput").value);
  if (!ml || ml <= 0) return alert("Ungültige ml");

  await fetch(`/api/pump/calibrate?id=${currentCalibPump}&ml=${ml}&seconds=${CALIB_SECONDS}`, { method: "POST" });
  closeCalibration();
};

/* ===================== NOT-AUS ===================== */
async function emergencyStop() {
  await fetch("/api/stop", { method: "POST" });
}

/* ===================== WEBSOCKET ===================== */
const ws = new WebSocket(`ws://${location.hostname}:81`);

ws.onmessage = e => {
  const msg = JSON.parse(e.data);

  if (msg.type === "pumpCalibration") {
    pumpCalibration = {};
    msg.pumps.forEach(p => pumpCalibration[p.id] = p);
    renderPumps();
    renderRecipes();
  }

  if (msg.type === "machineStatus") {
    machineRunning = msg.running;
    remainingMs = msg.remainingMs;

    const box = document.getElementById("statusBox");
    box.className = "status-box " + (machineRunning ? "running" : "idle");

    maxRemainingMs = machineRunning
      ? Math.max(maxRemainingMs, remainingMs)
      : 1;

    document.getElementById("statusText").textContent =
      machineRunning ? "Mixing…" : "Bereit";

    document.getElementById("timeLeft").textContent =
      machineRunning ? Math.ceil(remainingMs / 1000) + " s" : "";

    updateProgressRing();
    renderPumps();
    renderRecipes();
  }
};

function openRecipeWizard() {
  document.getElementById("recipeNameInput").value = "";
  document.getElementById("recipeIngredients").innerHTML = "";
  addRecipeIngredientRow(); // erste Zeile
  document.getElementById("recipeModal").style.display = "flex";
}

function closeRecipeWizard() {
  document.getElementById("recipeModal").style.display = "none";
}

function addRecipeIngredientRow() {
  const container = document.getElementById("recipeIngredients");

  const row = document.createElement("div");
  row.className = "recipe-ingredient-row";

  row.innerHTML = `
    <select class="ingredient-select">
      <option value="">Zutat wählen</option>
      ${ingredients.map(i =>
        `<option value="${i.name}">${i.name}</option>`
      ).join("")}
    </select>

    <input type="number"
           class="ingredient-percent"
           placeholder="%"
           min="1"
           max="100">

    <button class="btn delete" onclick="this.parentElement.remove()">🗑️</button>
  `;

  container.appendChild(row);
}

async function saveRecipe() {
  const name = document.getElementById("recipeNameInput").value.trim();
  if (!name) {
    alert("Rezeptname fehlt");
    return;
  }

  const rows = document.querySelectorAll(".recipe-ingredient-row");
  if (rows.length === 0) {
    alert("Mindestens eine Zutat erforderlich");
    return;
  }

  const params = new URLSearchParams();
  params.append("name", name);

  let index = 0;
  for (const row of rows) {
    const ing = row.querySelector(".ingredient-select").value;
    const percent = row.querySelector(".ingredient-percent").value;

    if (!ing || !percent) continue;

    params.append(`ingredient${index}_name`, ing);
    params.append(`ingredient${index}_percent`, percent);
    index++;
  }

  if (index === 0) {
    alert("Ungültige Zutaten");
    return;
  }

  const res = await fetch("/api/recipes", {
    method: "POST",
    body: params
  });

  if (!res.ok) {
    alert("Rezept konnte nicht gespeichert werden");
    return;
  }

  closeRecipeWizard();
  await loadInitialState(); // Rezepte neu laden
}


/* ===================== INIT ===================== */
window.onload = loadInitialState;
</script>

</body>
</html>
